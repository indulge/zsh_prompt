<svg xmlns="http://www.w3.org/2000/svg" width="620" height="433" viewBox="0 0 620 433" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Noto Sans Devanagari',monospace" font-size="14">
<rect width="620" height="433" rx="10" fill="#0d1117"/>
<rect width="620" height="32" rx="10" fill="#161b22"/>
<rect y="22" width="620" height="10" fill="#161b22"/>
<circle cx="22" cy="16" r="5.5" fill="#e0655a"/>
<circle cx="42" cy="16" r="5.5" fill="#dfa93c"/>
<circle cx="62" cy="16" r="5.5" fill="#47b06a"/>
<text x="90" y="20" fill="#8b949e" font-size="11">every shell opens with a verse</text>
<text x="18" y="79" xml:space="preserve"><tspan fill="#c9d1d9">   </tspan><tspan fill="#ffaf00">█</tspan><tspan fill="#ffd700">▀</tspan><tspan fill="#ffff00">▀</tspan><tspan fill="#ffd700"> </tspan><tspan fill="#ffaf00">█</tspan><tspan fill="#d75f00"> </tspan><tspan fill="#ff5f00">▀</tspan><tspan fill="#ff8700">█</tspan><tspan fill="#ffaf00">▀</tspan><tspan fill="#ffd700"> </tspan><tspan fill="#ffff00">▄</tspan><tspan fill="#ffd700">▀</tspan><tspan fill="#ffaf00">█</tspan></text>
<text x="18" y="100" xml:space="preserve"><tspan fill="#c9d1d9">   </tspan><tspan fill="#ffaf00">█</tspan><tspan fill="#ffd700">▄</tspan><tspan fill="#ffff00">█</tspan><tspan fill="#ffd700"> </tspan><tspan fill="#ffaf00">█</tspan><tspan fill="#d75f00"> </tspan><tspan fill="#ff5f00"> </tspan><tspan fill="#ff8700">█</tspan><tspan fill="#ffaf00"> </tspan><tspan fill="#ffd700"> </tspan><tspan fill="#ffff00">█</tspan><tspan fill="#ffd700">▀</tspan><tspan fill="#ffaf00">█</tspan></text>
<text x="18" y="121" xml:space="preserve"><tspan fill="#c9d1d9">   </tspan><tspan fill="#767676">╶─✦</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#ffd700">ॐ</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#ffaf5f" font-weight="bold">श्रीमद्भगवद्गीता</tspan><tspan fill="#767676"> · अध्याय २ · श्लोक ४७ ✦─╴</tspan></text>
<text x="18" y="142" xml:space="preserve"></text>
<text x="18" y="163" xml:space="preserve"><tspan fill="#c9d1d9">     </tspan><tspan fill="#ffd7af">कर्मण्येवाधिकारस्ते मा फलेषु कदाचन ।</tspan></text>
<text x="18" y="184" xml:space="preserve"><tspan fill="#c9d1d9">     </tspan><tspan fill="#ffd7af">मा कर्मफलहेतुर्भूर्मा ते सङ्गोऽस्त्वकर्मणि ॥</tspan></text>
<text x="18" y="205" xml:space="preserve"></text>
<text x="18" y="226" xml:space="preserve"><tspan fill="#c9d1d9">     </tspan><tspan fill="#d7afd7">तुम्हारा अधिकार केवल अपना कर्म करने में है, उसके फल पर कभी</tspan></text>
<text x="18" y="247" xml:space="preserve"><tspan fill="#c9d1d9">     </tspan><tspan fill="#d7afd7">नहीं। इसलिए फल की चाह को कर्म का कारण मत बनाओ, और न ही कर्म</tspan></text>
<text x="18" y="268" xml:space="preserve"><tspan fill="#c9d1d9">     </tspan><tspan fill="#d7afd7">छोड़ देने का मोह रखो।</tspan></text>
<text x="18" y="289" xml:space="preserve"></text>
<text x="18" y="310" xml:space="preserve"><tspan fill="#c9d1d9">     </tspan><tspan fill="#87afaf">You have a claim on your actions alone, never on their fruits.</tspan></text>
<text x="18" y="331" xml:space="preserve"><tspan fill="#c9d1d9">     </tspan><tspan fill="#87afaf">Let no desire for results drive what you do, yet never let that</tspan></text>
<text x="18" y="352" xml:space="preserve"><tspan fill="#c9d1d9">     </tspan><tspan fill="#87afaf">draw you toward abandoning action itself.</tspan></text>
<text x="18" y="373" xml:space="preserve"></text>
<text x="18" y="394" xml:space="preserve"></text>
<text x="18" y="415" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#ff87ff">🙏 धन्यवाद</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#767676">·</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#5fd7d7">0 commands</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#767676">·</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#5fd7d7">0s</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#767676">·</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#ffafff">फिर मिलेंगे ✨</tspan></text>
</svg>