<text x="18" y="100" xml:space="preserve"><tspan fill="#c9d1d9">   </tspan><tspan fill="#8787af">█</tspan><tspan fill="#af87af">▀</tspan><tspan fill="#afafd7">█</tspan><tspan fill="#d7afff"> </tspan><tspan fill="#d7d7ff">█</tspan><tspan fill="#d7d7af">▄</tspan><tspan fill="#d7af5f">█</tspan><tspan fill="#875faf"> </tspan><tspan fill="#8787af">█</tspan><tspan fill="#af87af">▀</tspan><tspan fill="#afafd7">▄</tspan><tspan fill="#d7afff"> </tspan><tspan fill="#d7d7ff">█</tspan><tspan fill="#d7d7af">█</tspan><tspan fill="#d7af5f">▄</tspan><tspan fill="#875faf"> </tspan><tspan fill="#8787af">█</tspan><tspan fill="#af87af">▄</tspan><tspan fill="#afafd7">▄</tspan><tspan fill="#d7afff"> </tspan><tspan fill="#d7d7ff">█</tspan><tspan fill="#d7d7af"> </tspan><tspan fill="#d7af5f">█</tspan><tspan fill="#875faf">▄</tspan><tspan fill="#8787af">█</tspan><tspan fill="#af87af"> </tspan><tspan fill="#afafd7">▄</tspan><tspan fill="#d7afff">█</tspan></text>
<text x="18" y="121" xml:space="preserve"><tspan fill="#c9d1d9">   </tspan><tspan fill="#767676">╶─✦</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#ffd700">🏛️</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#ffaf5f" font-weight="bold">Meditations · मार्कस औरेलियस</tspan><tspan fill="#767676"> · Book IV · 17 ✦─╴</tspan></text>
<text x="18" y="142" xml:space="preserve"></text>
<text x="18" y="163" xml:space="preserve"><tspan fill="#c9d1d9">     </tspan><tspan fill="#ffd7af">Do not act as if thou wert going to live ten thousand years.</tspan></text>
<text x="18" y="184" xml:space="preserve"><tspan fill="#c9d1d9">     </tspan><tspan fill="#ffd7af">Death hangs over thee. While thou livest, while it is in thy</tspan></text>
<text x="18" y="205" xml:space="preserve"><tspan fill="#c9d1d9">     </tspan><tspan fill="#ffd7af">power, be good.</tspan></text>
<text x="18" y="226" xml:space="preserve"></text>
<text x="18" y="247" xml:space="preserve"><tspan fill="#c9d1d9">     </tspan><tspan fill="#d7afd7">ऐसे मत जियो जैसे दस हज़ार वर्ष जीने वाले हो। मृत्यु सिर पर खड़ी</tspan></text>
<text x="18" y="268" xml:space="preserve"><tspan fill="#c9d1d9">     </tspan><tspan fill="#d7afd7">है। जब तक जीते हो, जब तक वश में है — भले बनो।</tspan></text>
<text x="18" y="289" xml:space="preserve"><tspan fill="#c9d1d9">     </tspan></text>
<text x="18" y="310" xml:space="preserve"></text>
<text x="18" y="331" xml:space="preserve"></text>
<text x="18" y="352" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#ff87ff">🙏 धन्यवाद</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#767676">·</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#5fd7d7">0 commands</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#767676">·</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#5fd7d7">0s</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#767676">·</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#ffafff">फिर मिलेंगे ✨</tspan></text>
