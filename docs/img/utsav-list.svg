<svg xmlns="http://www.w3.org/2000/svg" width="620" height="601" viewBox="0 0 620 601" font-family="ui-monospace,'JetBrains Mono',SFMono-Regular,Menlo,Consolas,'Noto Sans Devanagari',monospace" font-size="14">
<rect width="620" height="601" rx="10" fill="#0d1117"/>
<rect width="620" height="32" rx="10" fill="#161b22"/>
<rect y="22" width="620" height="10" fill="#161b22"/>
<circle cx="22" cy="16" r="5.5" fill="#e0655a"/>
<circle cx="42" cy="16" r="5.5" fill="#dfa93c"/>
<circle cx="62" cy="16" r="5.5" fill="#47b06a"/>
<text x="90" y="20" fill="#8b949e" font-size="11">utsav list</text>
<text x="18" y="79" xml:space="preserve"><tspan fill="#c9d1d9">   🌾 baisakhi     </tspan><tspan fill="#767676">बैसाखी — the wheat is gold, the harvest is home</tspan></text>
<text x="18" y="100" xml:space="preserve"><tspan fill="#c9d1d9">   🌅 chhath       </tspan><tspan fill="#767676">छठ पूजा — standing in the river, facing the sun</tspan></text>
<text x="18" y="121" xml:space="preserve"><tspan fill="#c9d1d9">   🎄 christmas    </tspan><tspan fill="#767676">Merry Christmas — stars over a quiet stable</tspan></text>
<text x="18" y="142" xml:space="preserve"><tspan fill="#c9d1d9">   🪔 diwali       </tspan><tspan fill="#767676">शुभ दीपावली — rows of lamps for the return home</tspan></text>
<text x="18" y="163" xml:space="preserve"><tspan fill="#c9d1d9">   🏹 dussehra     </tspan><tspan fill="#767676">विजयादशमी — good keeps its old promise</tspan></text>
<text x="18" y="184" xml:space="preserve"><tspan fill="#c9d1d9">   🐘 ganesh       </tspan><tspan fill="#767676">गणेश चतुर्थी — विघ्नहर्ता arrives, मोदक ready</tspan></text>
<text x="18" y="205" xml:space="preserve"><tspan fill="#c9d1d9">   ☬ gurpurab     </tspan><tspan fill="#767676">गुरपुरब — प्रकाश पर्व — a deepmala for Guru Nanak</tspan></text>
<text x="18" y="226" xml:space="preserve"><tspan fill="#c9d1d9">   🪷 gurupurnima  </tspan><tspan fill="#767676">गुरु पूर्णिमा — to the one who lights the lamp within</tspan></text>
<text x="18" y="247" xml:space="preserve"><tspan fill="#c9d1d9">   🚩 hanuman      </tspan><tspan fill="#767676">हनुमान जयंती — संकटमोचन का जन्मदिवस</tspan></text>
<text x="18" y="268" xml:space="preserve"><tspan fill="#c9d1d9">   🎨 holi         </tspan><tspan fill="#767676">होली है! — a play of colors</tspan></text>
<text x="18" y="289" xml:space="preserve"><tspan fill="#c9d1d9">   🦚 janmashtami  </tspan><tspan fill="#767676">जन्माष्टमी — midnight in Mathura, माखन everywhere</tspan></text>
<text x="18" y="310" xml:space="preserve"><tspan fill="#c9d1d9">   🔥 lohri        </tspan><tspan fill="#767676">लोहड़ी — the bonfire, the rewri, the songs</tspan></text>
<text x="18" y="331" xml:space="preserve"><tspan fill="#c9d1d9">   🌺 navratri     </tspan><tspan fill="#767676">नवरात्रि — nine nights, nine colors</tspan></text>
<text x="18" y="352" xml:space="preserve"><tspan fill="#c9d1d9">   🕯️ newyear      </tspan><tspan fill="#767676">नव वर्ष शुभ हो — candles for the year ahead</tspan></text>
<text x="18" y="373" xml:space="preserve"><tspan fill="#c9d1d9">   🌸 onam         </tspan><tspan fill="#767676">ओणम् — pookalam rings for the King who visits</tspan></text>
<text x="18" y="394" xml:space="preserve"><tspan fill="#c9d1d9">   🎀 rakhi        </tspan><tspan fill="#767676">रक्षाबंधन — a thread stronger than armour</tspan></text>
<text x="18" y="415" xml:space="preserve"><tspan fill="#c9d1d9">   🏹 ramnavami    </tspan><tspan fill="#767676">राम नवमी — अयोध्या में जन्म, धनुष की टंकार</tspan></text>
<text x="18" y="436" xml:space="preserve"><tspan fill="#c9d1d9">   🪁 sankranti    </tspan><tspan fill="#767676">मकर संक्रांति — kites on the north wind, til-gud sweetness</tspan></text>
<text x="18" y="457" xml:space="preserve"><tspan fill="#c9d1d9">   🔱 shivaratri   </tspan><tspan fill="#767676">महाशिवरात्रि — the still night — ॐ नमः शिवाय</tspan></text>
<text x="18" y="478" xml:space="preserve"><tspan fill="#c9d1d9">   🌼 vasant       </tspan><tspan fill="#767676">वसंत पंचमी — mustard-field yellow, सरस्वती की वीणा</tspan></text>
<text x="18" y="499" xml:space="preserve"></text>
<text x="18" y="520" xml:space="preserve"><tspan fill="#c9d1d9">   </tspan><tspan fill="#767676">utsav play &lt;key&gt; · utsav grand &lt;key&gt; · theme utsav — browse with preview</tspan></text>
<text x="18" y="541" xml:space="preserve"></text>
<text x="18" y="562" xml:space="preserve"></text>
<text x="18" y="583" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#ff87ff">🙏 धन्यवाद</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#767676">·</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#5fd7d7">0 commands</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#767676">·</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#5fd7d7">0s</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#767676">·</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#ffafff">फिर मिलेंगे ✨</tspan></text>
</svg>